<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <title>reagent</title>
    <style>
      /* ── Design tokens ── */
      :root {
        --bg:           #14110f;
        --surface:      #1f1b18;
        --surface-2:    #1a1612;
        --surface-3:    #221d19;
        --border:       #3a322c;
        --border-soft:  #2a2520;
        --text:         #eee;
        --text-dim:     #ddd;
        --text-muted:   #888;
        --text-faint:   #666;
        --text-mid:     #ccc;
        --text-bbb:     #bbb;
        --accent:       #c89;
        --accent-hover: #e8b0a0;
        --ok:           #2f7d4f;
        --ok-text:      #6dba8e;
        --err:          #8a3b2f;
        --err-text:     #d9735c;
        --gate-bg:      #2a1f14;
        --gate-border:  #a96;
        --warm-code:    #c8b8a2;
        --sp-1: 4px;
        --sp-2: 8px;
        --sp-3: 12px;
        --sp-4: 16px;
        --radius:    6px;
        --radius-lg: 8px;
      }

      /* ── Base ── */
      body { font: 15px/1.5 system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
      header { padding: var(--sp-3) var(--sp-4); background: var(--surface); font-weight: 600; }
      main { padding: var(--sp-3) var(--sp-4); max-width: 720px; margin: 0 auto; }
      pre { white-space: pre-wrap; color: var(--text-bbb); font-size: 13px; margin: 6px 0; }
      code { font-size: 13px; color: var(--text-bbb); }

      /* ── Phase pill ── */
      .phase { font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }

      /* ── Buttons ── */
      button { font: inherit; padding: var(--sp-2) 14px; border-radius: var(--radius); border: 0; cursor: pointer; }
      .approve { background: var(--ok); color: #fff; }
      .reject  { background: var(--err); color: #fff; }
      .decision-buttons { margin-top: 10px; }

      /* ── Inputs ── */
      input, textarea { width: 100%; box-sizing: border-box; background: var(--surface-3); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-2); margin: var(--sp-1) 0; }

      /* ── List view cards ── */
      .item { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--sp-3); margin: 10px 0; transition: border-color .15s; }
      .item:hover { border-color: var(--accent); }
      .gate { background: var(--gate-bg); border-color: var(--gate-border); }
      .card-link { display: block; text-decoration: none; color: inherit; }
      .card-link:hover strong { text-decoration: underline; }

      /* ── Back link ── */
      .back-link { display: inline-block; color: var(--accent); text-decoration: none; font-size: 14px; margin-bottom: 14px; }
      .back-link:hover { text-decoration: underline; }

      /* ── Job page header ── */
      .job-header { margin-bottom: var(--sp-4); }
      .job-title { margin: var(--sp-1) 0 0; font-size: 20px; font-weight: 700; }

      /* ── Phase stepper ── */
      .stepper {
        display: flex;
        align-items: center;
        margin: 18px 0 22px;
        overflow-x: auto;
        padding-bottom: var(--sp-1);
      }
      .step {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex-shrink: 0;
      }
      .step-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .04em;
        margin-top: 6px;
        white-space: nowrap;
      }
      /* circle indicator */
      .step::before {
        content: "";
        display: block;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid var(--border);
        background: var(--surface);
        box-sizing: border-box;
        transition: background .2s, border-color .2s;
      }
      .step.done::before    { background: var(--ok);  border-color: var(--ok); }
      .step.current::before { background: var(--accent); border-color: var(--accent); }
      .step.todo::before    { background: var(--surface); border-color: var(--border); }
      .step.error::before   { background: var(--err); border-color: var(--err); }
      .step.done .step-label    { color: var(--ok-text); }
      .step.current .step-label { color: var(--accent); font-weight: 700; }
      .step.todo .step-label    { color: var(--text-faint); }
      .step.error .step-label   { color: var(--err-text); font-weight: 700; }
      /* connector line between steps */
      .step-connector {
        flex: 1;
        height: 2px;
        background: var(--border);
        min-width: 16px;
        flex-shrink: 0;
        margin-bottom: 24px; /* align with circle row */
      }
      .step-connector.done { background: var(--ok); }

      /* ── Job page labeled fields ── */
      .job-fields { margin-bottom: 18px; }
      .field { margin: var(--sp-3) 0; }
      .field-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--text-muted);
        margin-bottom: var(--sp-1);
      }
      .field-value { color: var(--text-dim); }
      pre.field-value, code.field-value {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: var(--sp-2) 10px;
        display: block;
      }

      /* ── Checkpoint gate (job page) ── */
      .checkpoint-gate {
        background: var(--gate-bg);
        border: 2px solid var(--gate-border);
        border-radius: var(--radius-lg);
        padding: var(--sp-4);
        margin: var(--sp-4) 0;
      }

      /* ── Gate comment textarea ── */
      .gate-comment {
        display: block;
        width: 100%;
        box-sizing: border-box;
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid #5a4a3a;
        border-radius: var(--radius);
        padding: var(--sp-2) 10px;
        margin: 10px 0 6px;
        font: 13px/1.5 system-ui, sans-serif;
        resize: vertical;
      }
      .gate-comment::placeholder { color: var(--text-faint); }

      /* ── Markdown rendered content ── */
      .markdown { color: var(--text-dim); font-size: 14px; line-height: 1.6; }
      .markdown.field-value { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px var(--sp-3); }
      .md-h { margin: .6em 0 .3em; color: var(--text); font-weight: 700; }
      h1.md-h { font-size: 1.3em; }
      h2.md-h { font-size: 1.15em; }
      h3.md-h, h4.md-h, h5.md-h, h6.md-h { font-size: 1em; }
      .md-p { margin: .4em 0; }
      .md-ul, .md-ol { margin: .4em 0 .4em 1.4em; padding: 0; }
      .md-ul li, .md-ol li { margin: .2em 0; }
      .markdown code { background: var(--border-soft); border-radius: 3px; padding: 1px 5px; font-size: 12px; color: var(--warm-code); }
      .md-code-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-2) 10px; overflow-x: auto; margin: .5em 0; }
      .md-code-block code { background: none; padding: 0; color: var(--warm-code); font-size: 12px; }
      .markdown a { color: var(--accent); text-decoration: underline; }
      .markdown a:hover { color: var(--accent-hover); }

      /* ── Repos panel ── */
      .repos-panel { margin-bottom: 10px; }
      .repos-content { padding: var(--sp-2) 0; }
      .repos-empty { color: var(--text-faint); font-size: 13px; margin: var(--sp-1) 0 var(--sp-2); }
      .repos-list { list-style: none; margin: 0 0 10px; padding: 0; }
      .repo-item {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border-soft);
        font-size: 13px;
      }
      .repo-item:last-child { border-bottom: 0; }
      .repo-name { color: var(--text); font-weight: 600; white-space: nowrap; }
      .repo-path { color: var(--text-muted); flex: 1; word-break: break-all; font-size: 12px; }
      .repo-remove {
        font-size: 12px;
        padding: 3px var(--sp-2);
        background: #3a2520;
        color: var(--err-text);
        border-radius: var(--sp-1);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .add-repo-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 6px;
      }
      .add-repo-row input { flex: 1; min-width: 120px; margin: 2px 0; }
      .add-repo-row button { flex-shrink: 0; }

      /* ── Activity log ── */
      .log-section { margin-top: 20px; }
      .log-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--text-muted);
        margin-bottom: var(--sp-2);
      }
      .log-list {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .log-entry {
        display: flex;
        gap: var(--sp-3);
        align-items: baseline;
        padding: 7px var(--sp-3);
        border-bottom: 1px solid var(--border-soft);
        font-size: 13px;
        line-height: 1.5;
      }
      .log-entry:last-child { border-bottom: 0; }
      .log-ts {
        color: var(--text-faint);
        white-space: nowrap;
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      .log-line { color: var(--text-mid); word-break: break-word; }

      /* ── Units of work section ── */
      .units-section { margin-top: 20px; }
      .units-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--text-muted);
        margin-bottom: var(--sp-2);
      }
      .units-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: var(--sp-2);
      }
      .unit-item {
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--sp-3);
        background: var(--surface);
        transition: border-color .15s;
      }
      .unit-item:hover { border-color: var(--accent); }
      .unit-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        display: flex;
        align-items: center;
        gap: var(--sp-2);
        margin-bottom: var(--sp-1);
      }
      .unit-scope {
        font-size: 12px;
        color: var(--text-muted);
        margin: var(--sp-1) 0;
      }
      .unit-deps {
        font-size: 12px;
        color: var(--text-faint);
        margin: var(--sp-1) 0;
      }
      .unit-doc {
        font-size: 13px;
        color: var(--text-dim);
        margin-top: var(--sp-2);
      }
      .unit-doc code {
        background: var(--border-soft);
        border-radius: 3px;
        padding: 1px 5px;
        font-size: 12px;
        color: var(--warm-code);
      }

      /* ── Revision feedback section ── */
      .feedback-section { margin-top: 20px; }
      .feedback-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--text-muted);
        margin-bottom: var(--sp-2);
      }
      .feedback-list {
        list-style: none;
        margin: 0;
        padding: 0;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .feedback-entry {
        padding: var(--sp-2) var(--sp-3);
        border-bottom: 1px solid var(--border-soft);
        font-size: 13px;
        line-height: 1.5;
      }
      .feedback-entry:last-child { border-bottom: 0; }
      .feedback-ts {
        font-size: 11px;
        color: var(--text-faint);
        font-variant-numeric: tabular-nums;
        margin-bottom: var(--sp-1);
      }
      .feedback-note {
        color: var(--text-dim);
        word-break: break-word;
      }

      /* ── Role badges ── */
      .role-badge {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        padding: 2px 6px;
        border-radius: var(--radius);
        vertical-align: middle;
        white-space: nowrap;
        background: var(--border-soft);
        color: var(--text-muted);
      }
      .role-planner     { background: #1c2a3a; color: #7ab0d8; }
      .role-executor    { background: #1a2a1a; color: var(--ok-text); }
      .role-reviewer    { background: #2a1f14; color: #d4a84b; }
      .role-orchestrator { background: #221228; color: #b07ed8; }

      /* ── Verdict pills ── */
      .verdict-pill {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        padding: 2px 7px;
        border-radius: var(--radius);
        vertical-align: middle;
        white-space: nowrap;
      }
      .verdict-pass { background: var(--ok);  color: #fff; }
      .verdict-fail { background: var(--err); color: #fff; }

      /* ── Per-unit status badges ── */
      .unit-status {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .05em;
        padding: 2px 6px;
        border-radius: var(--radius);
        vertical-align: middle;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .status-pending { background: var(--border-soft); color: var(--text-faint); }
      .status-running { background: #1a2030; color: #7ab0d8; }
      .status-passed  { background: var(--ok);  color: #fff; }
      .status-failed  { background: var(--err); color: #fff; }

      /* ── Current-activity banner ── */
      .activity-banner {
        display: flex;
        align-items: baseline;
        gap: var(--sp-2);
        background: var(--surface);
        border: 1px solid var(--accent);
        border-radius: var(--radius-lg);
        padding: var(--sp-2) var(--sp-3);
        margin: var(--sp-3) 0;
        font-size: 13px;
        line-height: 1.5;
      }
      .activity-banner.idle {
        border-color: var(--border);
        opacity: .6;
      }
      .activity-banner-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--accent);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .activity-banner.idle .activity-banner-label {
        color: var(--text-muted);
      }
      .activity-banner-text {
        color: var(--text-mid);
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <header>reagent</header>
    <main>
      <!-- Repos panel and Start new work form are rebuilt by app.js at runtime.
           The markup below is an initial skeleton; app.js replaces it immediately. -->
      <details class="repos-panel">
        <summary>Repos</summary>
      </details>
      <details>
        <summary>Start new work</summary>
        <form id="new">
          <input name="title" placeholder="title" required />
          <datalist id="repo-datalist"></datalist>
          <input name="repoPath" placeholder="/path/to/repo" list="repo-datalist" required />
          <textarea name="request" placeholder="what needs doing?" required></textarea>
          <button type="submit">Start</button>
        </form>
      </details>
      <div id="items"></div>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
