name: Package Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bridge/package-lock.json
            desktop/package-lock.json

      # Step 1: Install and compile the bridge
      - name: Install bridge deps
        working-directory: bridge
        run: npm ci

      - name: Build bridge
        working-directory: bridge
        run: npm run build

      # Step 2: Slim the bridge — remove devDependencies before bundling
      - name: Prune bridge dev deps
        working-directory: bridge
        run: npm prune --omit=dev

      # Step 3: Install and compile the Electron main-process TypeScript
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build desktop
        working-directory: desktop
        run: npm run build

      # Step 4: Package — both macOS architectures; never publish to a registry
      - name: Package macOS (arm64 + x64)
        working-directory: desktop
        env:
          # Code-signing: Developer ID Application cert exported as base64-encoded .p12.
          # Read directly by electron-builder.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Notarization auth: APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD are read
          # automatically by electron-builder from the environment when the
          # notarytool path is active (i.e. when notarize.teamId is truthy).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID is NOT auto-read by electron-builder. It is consumed via
          # process.env.APPLE_TEAM_ID in desktop/electron-builder.js, which sets
          # mac.notarize = { teamId: process.env.APPLE_TEAM_ID }. This is what
          # triggers the modern notarytool path in electron-builder 24.13.3.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --x64 --arm64 --publish never

      # Step 5: Publish GitHub Release on tag push
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/out/*.dmg
            desktop/out/*.zip
          fail_on_unmatched_files: true

      # Step 5 (fallback): Upload artifacts on manual workflow_dispatch
      - name: Upload macOS installers (manual build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: reagent-mac
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
          if-no-files-found: error
