name: Package Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bridge/package-lock.json
            desktop/package-lock.json

      # Step 1: Install and compile the bridge
      - name: Install bridge deps
        working-directory: bridge
        run: npm ci

      - name: Build bridge
        working-directory: bridge
        run: npm run build

      # Step 2: Slim the bridge — remove devDependencies before bundling
      - name: Prune bridge dev deps
        working-directory: bridge
        run: npm prune --omit=dev

      # Step 3: Install and compile the Electron main-process TypeScript
      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build desktop
        working-directory: desktop
        run: npm run build

      # Step 3.5: Import the Developer ID Application cert into a dedicated keychain
      # that is ON THE DEFAULT SEARCH LIST for the whole job.
      #
      # WHY: if we only hand electron-builder CSC_LINK, it imports the cert into its
      # own *temporary* keychain (referenced via --keychain) that is NOT on the
      # default search list. App signing works (it resolves the identity by SHA-1),
      # but the afterAllArtifactBuild hook's bare `codesign --sign "Developer ID
      # Application"` searches only the default search list and fails with
      # "The specified item could not be found in the keychain."
      #
      # Importing into a search-listed keychain and pointing CSC_KEYCHAIN at it lets
      # BOTH electron-builder (auto-discovery) AND the manual hook resolve the
      # identity by name.
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Create, configure, and unlock a dedicated keychain.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import the Developer ID Application cert (base64-encoded .p12).
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Allow codesign to use the private key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Prepend our keychain to the user search list (preserving the existing
          # entries) so a bare `codesign --sign "Developer ID Application"` resolves.
          EXISTING=$(security list-keychains -d user | sed -e 's/[\"[:space:]]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING

          # Hand electron-builder this keychain; auto-discovery finds the identity.
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # Step 4: Package — both macOS architectures; never publish to a registry
      - name: Package macOS (arm64 + x64)
        working-directory: desktop
        env:
          # Code-signing: the Developer ID Application cert is already imported into
          # CSC_KEYCHAIN (see "Import signing certificate"). electron-builder uses
          # auto-discovery against that keychain — no CSC_LINK import needed here.
          # CSC_KEYCHAIN is exported via $GITHUB_ENV by the prior step.
          # Notarization auth: APPLE_ID and APPLE_APP_SPECIFIC_PASSWORD are read
          # automatically by electron-builder from the environment when the
          # notarytool path is active (i.e. when notarize.teamId is truthy).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID is NOT auto-read by electron-builder. It is consumed via
          # process.env.APPLE_TEAM_ID in desktop/electron-builder.js, which sets
          # mac.notarize = { teamId: process.env.APPLE_TEAM_ID }. This is what
          # triggers the modern notarytool path in electron-builder 24.13.3.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --x64 --arm64 --publish never

      # Step 5: Publish GitHub Release on tag push
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/out/*.dmg
            desktop/out/*.zip
          fail_on_unmatched_files: true

      # Step 5 (fallback): Upload artifacts on manual workflow_dispatch
      - name: Upload macOS installers (manual build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: reagent-mac
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
          if-no-files-found: error
