name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bridge/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
